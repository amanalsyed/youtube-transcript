<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A24" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>

  <!-- Icon Emblem -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="22" fill="#18181B" />
    <rect x="2" y="2" width="76" height="76" rx="20" fill="none" stroke="#27272A" stroke-width="2" />
    
    <!-- Red Play Badge -->
    <rect x="14" y="22" width="26" height="36" rx="8" fill="url(#logoRed)" />
    <polygon points="24,34 24,46 33,40" fill="#FFFFFF" />

    <!-- Transcript lines -->
    <rect x="46" y="27" width="22" height="5" rx="2.5" fill="#FFFFFF" />
    <circle cx="48.5" cy="40" r="2.5" fill="#FF1A24" />
    <rect x="54" y="37.5" width="14" height="5" rx="2.5" fill="#FFFFFF" />
    <rect x="46" y="48" width="18" height="5" rx="2.5" fill="#A1A1AA" />
  </g>

  <!-- Typography -->
  <text x="106" y="58" font-family="'Poppins', sans-serif" font-weight="700" font-size="28" fill="#18181B" letter-spacing="-0.5px">YouTube</text>
  <text x="238" y="58" font-family="'Poppins', sans-serif" font-weight="500" font-size="28" fill="#71717A" letter-spacing="-0.5px">Transcript</text>
</svg>
