<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A24" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="120" fill="#18181B" />
  
  <!-- Subtle inner border for contrast -->
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="#27272A" stroke-width="6" />

  <!-- Central Badge/Icon Composite: Play Button + Sound/Transcript Lines -->
  <!-- Left Side: YouTube Red Play Tablet / Shield -->
  <g filter="url(#subtleGlow)">
    <!-- Red Play Pill Container -->
    <rect x="80" y="146" width="160" height="220" rx="44" fill="url(#brandRed)" />
    <!-- White Play Triangle -->
    <polygon points="144,222 144,290 200,256" fill="#FFFFFF" />

    <!-- Right Side: Clean Modern Transcript / Dialogue Wave Lines -->
    <!-- Line 1 (Top - long) -->
    <rect x="276" y="176" width="156" height="28" rx="14" fill="#FFFFFF" />
    <!-- Line 2 (Middle - full with timestamp dot accent) -->
    <circle cx="290" cy="256" r="14" fill="#FF1A24" />
    <rect x="320" y="242" width="112" height="28" rx="14" fill="#FFFFFF" opacity="0.95" />
    <!-- Line 3 (Bottom - medium length) -->
    <rect x="276" y="308" width="126" height="28" rx="14" fill="#A1A1AA" />
  </g>
</svg>
